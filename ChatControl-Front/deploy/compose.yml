# Stack de produccion de ChatControl-Front.
# Destino: /srv/docker/chatcontrol-front/compose.yml
#
# Estructura esperada en el VPS:
#   /srv/docker/chatcontrol-front/.env    -> NEXT_PUBLIC_API_URL (interpolacion del build)
#   /srv/docker/chatcontrol-front/web/    -> release activo del repositorio
#
# La URL del API se incrusta en el bundle durante el build: cambiarla exige
# `docker compose up -d --build web`, no un simple reinicio.

services:
  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?Falta NEXT_PUBLIC_API_URL en /srv/docker/chatcontrol-front/.env}
    image: chatcontrol-web:latest
    container_name: chatcontrol-front
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3003"
    ports:
      # Host 3003 -> contenedor 3003. Solo loopback.
      - "127.0.0.1:3003:3003"
    networks: [internal]
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3003/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1));"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  internal:
    driver: bridge
