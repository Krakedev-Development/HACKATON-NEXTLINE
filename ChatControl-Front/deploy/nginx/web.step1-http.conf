# Etapa 1 (sin TLS): permite emitir el certificado con certbot --webroot.
# Destino: /etc/nginx/conf.d/chatcontrol-web.conf
# Después de emitir el certificado, sustituir por web.conf.

server {
    listen 80;
    listen [::]:80;
    server_name nextline.clearmindsec.com;

    location /.well-known/acme-challenge/ {
        root /var/www/_acme;
        try_files $uri =404;
    }

    location / {
        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
