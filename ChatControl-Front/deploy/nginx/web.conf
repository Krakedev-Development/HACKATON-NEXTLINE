# Etapa 2 (HTTPS) del front de ChatControl.
# Destino: /etc/nginx/conf.d/chatcontrol-web.conf
# Requiere el certificado en /etc/letsencrypt/live/hackaton.krakedev.com/.
#
# El WebSocket lo abre el navegador contra api.hackaton.krakedev.com:
# el Upgrade se configura en el vhost del API, no aquí.

server {
    listen 80;
    listen [::]:80;
    server_name hackaton.krakedev.com;

    location /.well-known/acme-challenge/ {
        root /var/www/_acme;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;   # Nginx >= 1.25; en versiones anteriores: listen 443 ssl http2;

    server_name hackaton.krakedev.com;

    ssl_certificate     /etc/letsencrypt/live/hackaton.krakedev.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hackaton.krakedev.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=()" always;

    location / {
        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
