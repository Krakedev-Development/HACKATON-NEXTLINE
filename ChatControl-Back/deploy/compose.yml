# Stack de producción de ChatControl-Back.
# Destino: /srv/docker/chatcontrol-back/compose.yml
#
# Estructura esperada en el VPS:
#   /srv/docker/chatcontrol-back/.env        -> POSTGRES_PASSWORD (solo interpola este archivo)
#   /srv/docker/chatcontrol-back/api/        -> release activo del repositorio
#   /srv/docker/chatcontrol-back/api/.env    -> variables de la API (no viaja en el repositorio)
#
# Nada de esto se publica a internet: la única entrada es Nginx en 80/443,
# que hace proxy a 127.0.0.1:4003.

services:
  db:
    image: postgres:15-alpine
    container_name: chatcontrol-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: chatcontrol
      POSTGRES_DB: chatcontrol
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD en /srv/docker/chatcontrol-back/.env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [internal]
    # Sin `ports`: la base de datos no se publica ni en loopback.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatcontrol -d chatcontrol"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build: ./api
    image: chatcontrol-api:latest
    container_name: chatcontrol-backend
    restart: unless-stopped
    env_file:
      - ./api/.env
    environment:
      NODE_ENV: production
      PORT: "3001"
      # Se deriva de POSTGRES_PASSWORD: no dupliques DATABASE_URL en api/.env,
      # aquí se sobrescribe de todos modos.
      DATABASE_URL: "postgresql://chatcontrol:${POSTGRES_PASSWORD}@db:5432/chatcontrol?schema=public"
    depends_on:
      db:
        condition: service_healthy
    ports:
      # Host 4003 -> contenedor 3001. Solo loopback.
      - "127.0.0.1:4003:3001"
    networks: [internal]
    # La API no expone /health: se comprueba que acepte conexiones TCP en su puerto.
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "const s=require('net').connect(3001,'127.0.0.1');s.on('connect',()=>{s.end();process.exit(0)});s.on('error',()=>process.exit(1));"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  # Nombre explícito para no colisionar con el volumen de otro stack.
  postgres_data:
    name: chatcontrol_postgres_data

networks:
  internal:
    driver: bridge
