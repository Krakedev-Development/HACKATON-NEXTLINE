# Etapa 1 (sin TLS): permite emitir el certificado con certbot --webroot.
# Destino: /etc/nginx/conf.d/chatcontrol-api.conf
# Después de emitir el certificado, sustituir por api.conf.

server {
    listen 80;
    listen [::]:80;
    server_name api.hackaton.krakedev.com;

    # Certbot escribe aquí el desafío ACME.
    location /.well-known/acme-challenge/ {
        root /var/www/_acme;
        try_files $uri =404;
    }

    client_max_body_size 25m;

    location / {
        # Sin barra final: la API espera el prefijo /api.
        proxy_pass http://127.0.0.1:4003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
