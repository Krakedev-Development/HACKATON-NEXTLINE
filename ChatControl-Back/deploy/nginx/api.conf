# Etapa 2 (HTTPS) del API de ChatControl.
# Destino: /etc/nginx/conf.d/chatcontrol-api.conf
# Requiere el certificado en /etc/letsencrypt/live/api.hackaton.krakedev.com/.
#
# `map` vive en el contexto http: este archivo se incluye desde conf.d, así que
# se define aquí y solo aquí (no duplicar en otros vhosts del servidor).

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.hackaton.krakedev.com;

    location /.well-known/acme-challenge/ {
        root /var/www/_acme;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;   # Nginx >= 1.25; en versiones anteriores: listen 443 ssl http2;

    server_name api.hackaton.krakedev.com;

    ssl_certificate     /etc/letsencrypt/live/api.hackaton.krakedev.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.hackaton.krakedev.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Adjuntos de WhatsApp (multipart): el límite por defecto de 1m no sirve.
    client_max_body_size 25m;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=()" always;

    location / {
        # Sin barra final: NO recorta el prefijo /api.
        proxy_pass http://127.0.0.1:4003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Socket.IO: sin estas cabeceras el WebSocket no completa el handshake.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # La IA puede tardar en responder.
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
}
